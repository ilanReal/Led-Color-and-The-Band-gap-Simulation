<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LED Band Gap Simulator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #1a1a1e;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #scene {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .band {
            background: #2a2a2f;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .band-label {
            font-size: clamp(22px, 4vw, 36px);
            font-weight: 700;
        }

        #conduction-band { height: 22%; }
        #gap-region { flex: 1; background: #1a1a1e; position: relative; }
        #valence-band { height: 22%; position: relative; overflow: hidden; }

        #controls {
            padding: 14px 32px;
            background: #111113;
            border-top: 1px solid #2a2a2f;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        #controls label {
            font-size: 13px;
            color: #888;
            white-space: nowrap;
        }

        #gap-slider {
            flex: 1;
            max-width: 340px;
            -webkit-appearance: none;
            height: 3px;
            border-radius: 3px;
            background: #333;
            outline: none;
            cursor: pointer;
        }

        #gap-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
        }

        #ev-display {
            font-size: 15px;
            font-weight: 600;
            min-width: 60px;
        }

        .stats {
            display: flex;
            gap: 28px;
            margin-left: auto;
        }

        .stat { display: flex; flex-direction: column; align-items: flex-end; }
        .stat-label { font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: 0.07em; }
        .stat-value { font-size: 15px; font-weight: 600; margin-top: 1px; }

        #gap-arrow {
            position: absolute;
            left: 48px;
            top: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            pointer-events: none;
        }

        #gap-arrow span {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
        }

        #arrow-line {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
        }

        .arrow-head {
            width: 0; height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
        }

        .arrow-up { border-bottom: 10px solid #fff; }
        .arrow-down { border-top: 10px solid #fff; }

        #arrow-shaft {
            width: 2px;
            background: #fff;
            flex: 1;
            min-height: 20px;
        }

        canvas#sparks {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="scene">
    <div class="band" id="conduction-band">
        <span class="band-label" id="cond-label">Conduction Band</span>
    </div>

    <div id="gap-region">
        <div id="gap-arrow">
            <span id="gap-label-text">Band Gap</span>
            <div id="arrow-line" style="flex:1; display:flex; flex-direction:column; align-items:center; width:14px;">
                <div class="arrow-head arrow-up"></div>
                <div id="arrow-shaft"></div>
                <div class="arrow-head arrow-down"></div>
            </div>
        </div>
        <canvas id="sparks"></canvas>
    </div>

    <div class="band" id="valence-band">
        <span class="band-label" id="val-label">Valence Band</span>
        <canvas id="electrons-canvas" style="position:absolute;inset:0;pointer-events:none;"></canvas>
    </div>
</div>

<div id="controls">
    <label for="gap-slider">Band gap energy</label>
    <input type="range" id="gap-slider" min="1.8" max="3.1" step="0.05" value="2.2">
    <span id="ev-display">2.20 eV</span>
    <div class="stats">
        <div class="stat">
            <span class="stat-label">Color</span>
            <span class="stat-value" id="stat-color">Green</span>
        </div>
        <div class="stat">
            <span class="stat-label">Wavelength</span>
            <span class="stat-value" id="stat-wl">564 nm</span>
        </div>
    </div>
</div>

<script>
const slider = document.getElementById('gap-slider');
const evDisplay = document.getElementById('ev-display');
const statColor = document.getElementById('stat-color');
const statWl = document.getElementById('stat-wl');
const condLabel = document.getElementById('cond-label');
const valLabel = document.getElementById('val-label');
const sparksCanvas = document.getElementById('sparks');
const eCanvas = document.getElementById('electrons-canvas');
const sCtx = sparksCanvas.getContext('2d');
const eCtx = eCanvas.getContext('2d');

function evToHsl(ev) {
    const t = (ev - 1.8) / (3.1 - 1.8);
    const h = 260 - t * 260;
    return `hsl(${h}, 90%, 58%)`;
}

function evToName(ev) {
    if (ev < 2.0) return 'Red';
    if (ev < 2.15) return 'Orange';
    if (ev < 2.45) return 'Yellow';
    if (ev < 2.75) return 'Green';
    if (ev < 2.95) return 'Blue';
    return 'Violet';
}

function evToWl(ev) { return Math.round(1240 / ev); }

function resizeCanvases() {
    const gap = document.getElementById('gap-region');
    sparksCanvas.width = gap.offsetWidth;
    sparksCanvas.height = gap.offsetHeight;

    const vb = document.getElementById('valence-band');
    eCanvas.width = vb.offsetWidth;
    eCanvas.height = vb.offsetHeight;
}

resizeCanvases();
window.addEventListener('resize', resizeCanvases);

const electrons = [];
const NUM_ELECTRONS = 11;

function initElectrons() {
    electrons.length = 0;
    const W = eCanvas.width;
    const H = eCanvas.height;
    const spacing = W / (NUM_ELECTRONS + 1);
    for (let i = 0; i < NUM_ELECTRONS; i++) {
        electrons.push({
            x: spacing * (i + 1),
            baseY: H / 2,
            y: H / 2,
            phase: Math.random() * Math.PI * 2,
            rising: false,
            riseY: 0,
            riseVY: 0,
            burst: false
        });
    }
}

initElectrons();
window.addEventListener('resize', initElectrons);

const sparks = [];

function triggerElectron(idx) {
    const e = electrons[idx];
    if (e.rising || e.burst) return;
    e.rising = true;
    e.riseY = e.baseY;
    e.riseVY = -(4 + Math.random() * 2);
}

function createSparks(x, y, color) {
    for (let i = 0; i < 12; i++) {
        const angle = (Math.PI * 2 * i / 12) + (Math.random() - 0.5) * 0.4;
        const speed = 2 + Math.random() * 3.5;
        sparks.push({
            x: sparksCanvas.width / 2 + (Math.random() - 0.5) * 40,
            y: sparksCanvas.height,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 2,
            opacity: 1,
            r: 4 + Math.random() * 3,
            color
        });
    }
}

let spawnTimer = 0;
let lastRisingIdx = -1;

function update() {
    const ev = parseFloat(slider.value);
    const color = evToHsl(ev);
    const W = eCanvas.width;
    const H = eCanvas.height;

    spawnTimer++;
    if (spawnTimer > 50) {
        const idx = Math.floor(Math.random() * NUM_ELECTRONS);
        triggerElectron(idx);
        spawnTimer = 0;
    }

    eCtx.clearRect(0, 0, W, H);

    electrons.forEach((e, i) => {
        if (e.rising) {
            e.riseVY += 0.35;
            e.riseY += e.riseVY;
            if (e.riseY <= -20) {
                e.rising = false;
                e.burst = true;
                createSparks(e.x, 0, color);
                setTimeout(() => { e.burst = false; }, 600);
            }
            const drawY = e.rising ? e.riseY : e.baseY;
            drawElectron(e.x, drawY, color);
        } else if (!e.burst) {
            const bobY = e.baseY + Math.sin(Date.now() * 0.0012 + e.phase) * 3;
            drawElectron(e.x, bobY, color);
        }
    });

    sCtx.clearRect(0, 0, sparksCanvas.width, sparksCanvas.height);
    for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        s.x += s.vx;
        s.y += s.vy;
        s.vy += 0.1;
        s.opacity -= 0.025;
        if (s.opacity <= 0) { sparks.splice(i, 1); continue; }
        sCtx.beginPath();
        sCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        sCtx.fillStyle = s.color;
        sCtx.globalAlpha = s.opacity;
        sCtx.fill();
        sCtx.globalAlpha = 1;
    }

    requestAnimationFrame(update);
}

function drawElectron(x, y, color) {
    const r = Math.min(eCanvas.width, eCanvas.height) * 0.085;
    eCtx.beginPath();
    eCtx.arc(x, y, r, 0, Math.PI * 2);
    eCtx.fillStyle = color;
    eCtx.fill();

    eCtx.beginPath();
    eCtx.rect(x - r * 0.5, y - r * 0.12, r * 1.0, r * 0.24);
    eCtx.fillStyle = 'rgba(0,0,0,0.45)';
    eCtx.fill();
}

function applyColor(ev) {
    const color = evToHsl(ev);
    condLabel.style.color = color;
    valLabel.style.color = color;
    evDisplay.style.color = color;
    statColor.style.color = color;
    statWl.style.color = color;
    statColor.textContent = evToName(ev);
    statWl.textContent = evToWl(ev) + ' nm';
    evDisplay.textContent = ev.toFixed(2) + ' eV';
}

slider.addEventListener('input', () => applyColor(parseFloat(slider.value)));

applyColor(parseFloat(slider.value));
update();
</script>

</body>
</html>
