<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LED Band Gap Simulator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0f0f11;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #top-bar {
            width: 100%;
            padding: 20px 40px;
            display: flex;
            align-items: center;
            gap: 24px;
            border-bottom: 1px solid #1e1e22;
        }

        #top-bar label {
            font-size: 13px;
            color: #888;
            white-space: nowrap;
        }

        #gap-slider {
            flex: 1;
            max-width: 320px;
            -webkit-appearance: none;
            height: 2px;
            border-radius: 2px;
            background: #333;
            outline: none;
            cursor: pointer;
        }

        #gap-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
        }

        #ev-display {
            font-size: 14px;
            font-weight: 500;
            min-width: 56px;
            color: #fff;
        }

        #stats {
            display: flex;
            gap: 32px;
            margin-left: auto;
        }

        .stat {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .stat-label {
            font-size: 11px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .stat-value {
            font-size: 15px;
            font-weight: 500;
            color: #fff;
            margin-top: 2px;
        }

        #canvas-wrap {
            flex: 1;
            width: 100%;
            position: relative;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

<div id="top-bar">
    <label for="gap-slider">Band gap energy</label>
    <input type="range" id="gap-slider" min="1.8" max="3.1" step="0.05" value="2.2">
    <span id="ev-display">2.20 eV</span>
    <div id="stats">
        <div class="stat">
            <span class="stat-label">Color</span>
            <span class="stat-value" id="stat-color">Green</span>
        </div>
        <div class="stat">
            <span class="stat-label">Wavelength</span>
            <span class="stat-value" id="stat-wl">564 nm</span>
        </div>
    </div>
</div>

<div id="canvas-wrap">
    <canvas id="c"></canvas>
</div>

<script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const slider = document.getElementById('gap-slider');
    const evDisplay = document.getElementById('ev-display');
    const statColor = document.getElementById('stat-color');
    const statWl = document.getElementById('stat-wl');

    let W, H, ledgeY, floorY, centerX;

    function resize() {
        const wrap = document.getElementById('canvas-wrap');
        W = canvas.width = wrap.offsetWidth;
        H = canvas.height = wrap.offsetHeight;
        centerX = W / 2;
        floorY = H - 80;
    }

    resize();
    window.addEventListener('resize', resize);

    function evToColor(ev) {
        const t = (ev - 1.8) / (3.1 - 1.8);
        const h = 260 - t * 260;
        return `hsl(${h}, 90%, 60%)`;
    }

    function evToName(ev) {
        if (ev < 2.0) return 'Red';
        if (ev < 2.2) return 'Orange';
        if (ev < 2.5) return 'Yellow';
        if (ev < 2.7) return 'Green';
        if (ev < 2.95) return 'Blue';
        return 'Violet';
    }

    function evToWavelength(ev) {
        return Math.round(1240 / ev);
    }

    const electrons = [];
    let spawnTimer = 0;

    function spawnElectron(ev) {
        const gapPx = ev * 120;
        const ly = floorY - gapPx;
        electrons.push({
            x: centerX + (Math.random() - 0.5) * 40,
            y: ly,
            vy: 0,
            color: evToColor(ev),
            sparks: null,
            done: false,
            ledgeY: ly,
            floorY: floorY
        });
    }

    function createSparks(x, y, color) {
        const sparks = [];
        for (let i = 0; i < 10; i++) {
            const angle = (Math.PI * 2 * i / 10) - Math.PI * 0.5 + (Math.random() - 0.5) * 0.6;
            const speed = 2.5 + Math.random() * 3;
            sparks.push({
                x, y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                opacity: 1,
                r: 2.5 + Math.random() * 2,
                color
            });
        }
        return sparks;
    }

    function draw() {
        const ev = parseFloat(slider.value);
        const color = evToColor(ev);
        const gapPx = ev * 120;
        ledgeY = floorY - gapPx;

        ctx.clearRect(0, 0, W, H);

        const bandW = 280;
        const bx = centerX - bandW / 2;

        ctx.fillStyle = '#1a1a1f';
        ctx.fillRect(bx, ledgeY - 1, bandW, 14);
        ctx.fillStyle = '#1a1a1f';
        ctx.fillRect(bx, floorY - 1, bandW, 14);

        ctx.fillStyle = '#333';
        ctx.font = '11px -apple-system, sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('Conduction band', bx + bandW + 16, ledgeY + 8);
        ctx.fillText('Valence band', bx + bandW + 16, floorY + 8);

        ctx.strokeStyle = '#2a2a2a';
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 6]);
        ctx.beginPath();
        ctx.moveTo(bx, ledgeY - 1 + 6);
        ctx.lineTo(bx - 60, ledgeY - 1 + 6);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(bx, floorY - 1 + 6);
        ctx.lineTo(bx - 60, floorY - 1 + 6);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.strokeStyle = color;
        ctx.lineWidth = 1;
        const mx = bx - 30;
        const arrowPad = 6;
        ctx.beginPath();
        ctx.moveTo(mx, ledgeY + arrowPad);
        ctx.lineTo(mx, floorY - arrowPad);
        ctx.stroke();
        [ledgeY + arrowPad, floorY - arrowPad].forEach((py, i) => {
            const dir = i === 0 ? 1 : -1;
            ctx.beginPath();
            ctx.moveTo(mx - 5, py + dir * 7);
            ctx.lineTo(mx, py);
            ctx.lineTo(mx + 5, py + dir * 7);
            ctx.strokeStyle = color;
            ctx.lineWidth = 1;
            ctx.stroke();
        });

        ctx.fillStyle = color;
        ctx.font = '12px -apple-system, sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(`${ev.toFixed(2)} eV`, mx - 8, ledgeY + gapPx / 2 + 5);

        spawnTimer++;
        if (spawnTimer > 55) {
            spawnElectron(ev);
            spawnTimer = 0;
        }

        for (let i = electrons.length - 1; i >= 0; i--) {
            const e = electrons[i];

            if (e.sparks) {
                let alive = false;
                for (const s of e.sparks) {
                    s.x += s.vx;
                    s.y += s.vy;
                    s.vy += 0.08;
                    s.opacity -= 0.028;
                    if (s.opacity > 0) {
                        alive = true;
                        ctx.beginPath();
                        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                        ctx.fillStyle = s.color;
                        ctx.globalAlpha = s.opacity;
                        ctx.fill();
                        ctx.globalAlpha = 1;
                    }
                }
                if (!alive) electrons.splice(i, 1);
                continue;
            }

            e.vy += 0.45;
            e.y += e.vy;

            if (e.y + 7 >= e.floorY) {
                e.y = e.floorY - 7;
                e.sparks = createSparks(e.x, e.y, e.color);
                continue;
            }

            ctx.beginPath();
            ctx.arc(e.x, e.y, 7, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
        }

        requestAnimationFrame(draw);
    }

    slider.addEventListener('input', function () {
        const ev = parseFloat(this.value);
        evDisplay.textContent = ev.toFixed(2) + ' eV';
        statColor.textContent = evToName(ev);
        statWl.textContent = evToWavelength(ev) + ' nm';
        statWl.style.color = evToColor(ev);
        statColor.style.color = evToColor(ev);
    });

    const initEv = parseFloat(slider.value);
    statColor.textContent = evToName(initEv);
    statWl.textContent = evToWavelength(initEv) + ' nm';
    statWl.style.color = evToColor(initEv);
    statColor.style.color = evToColor(initEv);

    draw();
</script>

</body>
</html>
