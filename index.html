<!DOCTYPE html>
<html lang="en">
<style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #333;
            --border-color: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            width: 400px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        h2 { font-weight: 400; margin-bottom: 1.5rem; }

        .led-display {
            width: 80px;
            height: 80px;
            border-radius: 50% 50% 10% 10%;
            margin: 0 auto 1.5rem;
            background-color: #ff0000;
            box-shadow: 0 0 20px rgba(255,0,0,0.5);
            transition: all 0.3s ease;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
            text-align: left;
            font-family: monospace;
        }

        .label { color: #666; font-size: 0.8rem; }
        .value { font-size: 1.1rem; font-weight: bold; }

        input[type=range] {
            width: 100%;
            margin: 20px 0;
            cursor: pointer;
        }

        .formula {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
            font-size: 0.9rem;
            color: #555;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>LED Band Gap Simulator</h2>
    
    <div id="led" class="led-display"></div>

    <div class="stats">
        <div>
            <div class="label">Band Gap (Eg)</div>
            <div id="eg-val" class="value">1.80 eV</div>
        </div>
        <div>
            <div class="label">Wavelength (λ)</div>
            <div id="wl-val" class="value">689 nm</div>
        </div>
    </div>

    <input type="range" id="gap-slider" min="1.6" max="3.2" step="0.01" value="1.8">
    
    <div class="formula">
        λ = (1240 / Eg) nm
    </div>
</div>

<script>
    const slider = document.getElementById('gap-slider');
    const egDisplay = document.getElementById('eg-val');
    const wlDisplay = document.getElementById('wl-val');
    const led = document.getElementById('led');

    function nmToRGB(wavelength) {
        let r, g, b, factor;
        if (wavelength >= 380 && wavelength < 440) {
            r = -(wavelength - 440) / (440 - 380); g = 0.0; b = 1.0;
        } else if (wavelength >= 440 && wavelength < 490) {
            r = 0.0; g = (wavelength - 440) / (490 - 440); b = 1.0;
        } else if (wavelength >= 490 && wavelength < 510) {
            r = 0.0; g = 1.0; b = -(wavelength - 510) / (510 - 490);
        } else if (wavelength >= 510 && wavelength < 580) {
            r = (wavelength - 510) / (580 - 510); g = 1.0; b = 0.0;
        } else if (wavelength >= 580 && wavelength < 645) {
            r = 1.0; g = -(wavelength - 645) / (645 - 580); b = 0.0;
        } else if (wavelength >= 645 && wavelength < 781) {
            r = 1.0; g = 0.0; b = 0.0;
        } else {
            r = 0.0; g = 0.0; b = 0.0;
        }
        return `rgb(${Math.round(r * 255)}, ${Math.round(g * 255)}, ${Math.round(b * 255)})`;
    }

    slider.oninput = function() {
        const eg = parseFloat(this.value);
        // Using the simplified hc constant (1240 eV*nm)
        const wavelength = Math.round(1240 / eg);
        const color = nmToRGB(wavelength);

        egDisplay.innerText = eg.toFixed(2) + " eV";
        wlDisplay.innerText = wavelength + " nm";
        
        led.style.backgroundColor = color;
        led.style.boxShadow = `0 0 30px ${color}`;
    };
</script>

</body>
</html>
