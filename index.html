<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LED Band Gap Simulator</title>
    <style>
        body {
            margin: 0;
            background: #0a0a0c;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }
        #controls {
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 30px;
            border-bottom: 1px solid #333;
            z-index: 10;
        }
        .slider-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            cursor: crosshair;
        }
        .label-text {
            font-size: 14px;
            margin-bottom: 5px;
            color: #aaa;
        }
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            max-width: 300px;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="controls">
    <div class="slider-group">
        <div class="label-text">Band Gap Energy ($E_g$)</div>
        <input type="range" id="gapHeight" min="1.8" max="3.1" step="0.05" value="2.0" style="width:200px">
        <div id="evDisplay">2.00 eV</div>
    </div>
</div>

<div id="info">
    <strong>Quantum-Classical Analogy</strong><br>
    The ball is an <em>electron</em>. The ledge is the <em>Conduction Band</em>. The floor is the <em>Valence Band</em>. Falling across the "Gap" releases light.
</div>

<canvas id="ledCanvas"></canvas>

<script>
    const canvas = document.getElementById('ledCanvas');
    const ctx = canvas.getContext('2d');
    const gapSlider = document.getElementById('gapHeight');
    const evDisplay = document.getElementById('evDisplay');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let ball = { x: canvas.width / 2, y: 0, dy: 0, radius: 12, falling: false };
    let photons = [];
    
    // Physical Constants
    const gravity = 0.5;
    const floorY = canvas.height - 100;

    function getLEDColor(ev) {
        // Simple eV to RGB mapping
        // 1.8 eV (Red) to 3.1 eV (Violet)
        const ratio = (ev - 1.8) / (3.1 - 1.8);
        const hue = 240 - (ratio * 240); // 240 (Blue) to 0 (Red)
        return `hsl(${hue}, 100%, 50%)`;
    }

    function drawScene() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const ev = parseFloat(gapSlider.value);
        const gapPx = ev * 150; // Visual scaling
        const ledgeY = floorY - gapPx;
        const color = getLEDColor(ev);

        // Draw Ledge (Conduction Band)
        ctx.strokeStyle = '#555';
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        ctx.moveTo(canvas.width/2 - 100, ledgeY);
        ctx.lineTo(canvas.width/2 + 100, ledgeY);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = '#333';
        ctx.fillRect(canvas.width/2 - 120, ledgeY, 240, 10);
        ctx.fillStyle = '#aaa';
        ctx.fillText("CONDUCTION BAND", canvas.width/2 - 50, ledgeY - 15);

        // Draw Ground (Valence Band)
        ctx.fillStyle = '#222';
        ctx.fillRect(0, floorY, canvas.width, 100);
        ctx.fillStyle = color;
        ctx.globalAlpha = 0.3;
        ctx.fillRect(0, floorY, canvas.width, 2); // Glow on floor
        ctx.globalAlpha = 1.0;
        ctx.fillStyle = '#aaa';
        ctx.fillText("VALENCE BAND", 20, floorY + 25);

        // Update & Draw Ball
        if (!ball.falling) {
            ball.y = ledgeY - ball.radius;
            ball.x = canvas.width / 2;
            // Auto-drop logic
            if (Math.random() < 0.02) ball.falling = true;
        } else {
            ball.dy += gravity;
            ball.y += ball.dy;

            if (ball.y + ball.radius >= floorY) {
                ball.y = floorY - ball.radius;
                // Emit Photon
                photons.push({
                    x: ball.x,
                    y: ball.y,
                    r: 5,
                    opacity: 1,
                    color: color,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10
                });
                // Reset Ball
                ball.falling = false;
                ball.dy = 0;
            }
        }

        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fillStyle = "white";
        ctx.shadowBlur = 15;
        ctx.shadowColor = "white";
        ctx.fill();
        ctx.shadowBlur = 0;

        // Draw Photons (The "Sound" or Light)
        for (let i = photons.length - 1; i >= 0; i--) {
            let p = photons[i];
            p.x += p.vx;
            p.y += p.vy;
            p.opacity -= 0.02;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.opacity;
            ctx.shadowBlur = 10;
            ctx.shadowColor = p.color;
            ctx.fill();
            
            if (p.opacity <= 0) photons.splice(i, 1);
        }
        ctx.globalAlpha = 1.0;
        ctx.shadowBlur = 0;

        requestAnimationFrame(drawScene);
    }

    gapSlider.oninput = function() {
        evDisplay.innerText = `${parseFloat(this.value).toFixed(2)} eV`;
    };

    window.onresize = function() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    };

    drawScene();
</script>

</body>
</html>
